# WKD for gnuweeb.org: the part to add to the existing HTTPS server
# block of gnuweeb.org. An example, not a whole configuration; the
# certificate lines stand for whatever that block uses today.
#
# GnuPG fetches https://gnuweeb.org/.well-known/openpgpkey/policy and
# .../hu/<hash>, so the whole prefix goes to matcha's WKD listener, not
# only hu/. It must win over the redirect to www.gnuweeb.org: a
# "return" directly in the server block runs before any location is
# chosen, so move the redirect into "location /" as below.
#
# Clients try https://openpgpkey.gnuweeb.org first and use these URLs
# only when that name has no address, so keep it unresolvable: no
# record, and no wildcard that would catch it.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gnuweeb.org;

    ssl_certificate     /etc/letsencrypt/live/gnuweeb.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gnuweeb.org/privkey.pem;

    # ^~ keeps regular-expression locations from taking these URLs.
    location ^~ /.well-known/openpgpkey/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # The routes only answer GET and HEAD.
        limit_except GET {
            deny all;
        }
    }

    location / {
        return 302 https://www.gnuweeb.org$request_uri;
    }
}
