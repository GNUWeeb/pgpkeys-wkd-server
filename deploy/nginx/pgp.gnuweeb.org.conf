# The dashboard at https://pgp.gnuweeb.org, proxied to matcha's
# dashboard listener. An example; the certificate paths follow certbot.
#
# The dashboard's cookies carry the __Host- prefix and are Secure, so
# it must be served over HTTPS. Set BASE_URL=https://pgp.gnuweeb.org
# and REAL_IP_HEADER=X-Real-IP in matcha's environment (compose.yaml
# sets the latter).

server {
    listen 80;
    listen [::]:80;
    server_name pgp.gnuweeb.org;

    location / {
        return 301 https://pgp.gnuweeb.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pgp.gnuweeb.org;

    ssl_certificate     /etc/letsencrypt/live/pgp.gnuweeb.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pgp.gnuweeb.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # matcha accepts forms up to 2 MiB (a 1 MiB key, armored, plus the
    # form around it); nginx's default of 1 MiB would refuse some keys.
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        # Overwritten, never appended: matcha counts its per-client
        # rate limit by this header.
        proxy_set_header X-Real-IP $remote_addr;
    }
}
